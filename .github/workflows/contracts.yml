name: Contracts

on:
  push:
    branches: [main]
    paths:
      - "packages/contracts/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "packages/contracts/**"
      - ".github/workflows/contracts.yml"

jobs:
  foundry:
    name: forge fmt · build · test · abi-sync
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format check
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      # Enforce the ABI single source of truth (finding 002): regenerate from the fresh build and
      # fail if the committed shared/subgraph ABIs drifted from the contract. sync-abis uses only
      # Node builtins, so no pnpm install is needed.
      - name: ABI drift check
        working-directory: ${{ github.workspace }}
        run: |
          node packages/contracts/script/sync-abis.mjs
          git diff --exit-code -- \
            packages/shared/src/abis/assuranceHub.ts \
            packages/subgraph/abis/AssuranceHub.json
