name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  js:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm MUST be installed before setup-node's pnpm cache (plan §17.7-13).
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail fast on a leaked secret before doing any other work. Uses git ls-files +
      # working-tree reads + the CRE harness positive control (all available post-install).
      - name: Secret-leak gate
        run: pnpm gate:secrets

      - name: Generate (Prisma client, subgraph types)
        run: pnpm codegen

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Contracts (forge build) are covered by the dedicated Contracts workflow,
      # which installs Foundry. Exclude them here so the JS job needs no forge.
      - name: Build
        run: pnpm build --filter='!@vouch/contracts'
