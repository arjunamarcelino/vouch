packages:
  - "apps/*"
  - "packages/*"

# Single-version pins shared across the workspace. Reference with "catalog:" in
# each package.json so zod/typescript never resolve to two conflicting copies
# (see plan §17.7 — SDKs that pin zod can otherwise split the version).
# zod bumped to ^4.6.1 alongside fastify-type-provider-zod@7 (agent REST adapter).
catalog:
  typescript: "^5.9.2"
  zod: "^4.6.1"
  viem: "^2.55.0"

# pnpm 10 blocks dependency build scripts by default. Allowlist the ones we need
# or install leaves Prisma/esbuild/tailwind-oxide unbuilt (plan §17.7-10).
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "esbuild"
  - "@tailwindcss/oxide"
  - "@parcel/watcher"
  - "@swc/core"

# Force patched versions of transitive deps flagged HIGH by `pnpm audit` (2026-09-12,
# "verify end-to-end assurance lifecycle"). All are deep-transitive (wagmi/walletconnect,
# NestJS, Prisma); none is a direct dependency, so these overrides pull the fix without an
# app-code change. Ranges are UPPER-BOUNDED to the vetted major so a future `pnpm update`
# can't silently pull an untested major (esp. deepmerge-ts, which @prisma/config uses to merge
# prisma.config.ts). Verified: install re-resolves to the same versions Prisma 7.10 expects,
# `pnpm audit` stays 0 high/critical, AND the DB layer round-trips
# (`pnpm --filter @vouch/db codegen` + `prisma validate`), plus typecheck/build/tests green.
overrides:
  ws: ">=8.21.0 <9"
  axios: ">=1.18.0 <2"
  multer: ">=2.3.0 <3"
  mysql2: ">=3.22.0 <4"
  deepmerge-ts: ">=8.0.0 <9"
