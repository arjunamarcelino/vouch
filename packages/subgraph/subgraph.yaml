specVersion: 1.3.0
description: Vouch — indexes VouchCore events into authoritative provider performance history.
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum
    name: VouchCore
    # Arc testnet (eip155:5042002). Only `network` changes between environments; addresses and
    # startBlocks are driven per-network via networks.json (see plan §17.4).
    network: arc-testnet
    source:
      # TODO: replace with the deployed VouchCore address (also update networks.json).
      address: "0x0000000000000000000000000000000000000000"
      abi: VouchCore
      # TODO: set to the VouchCore deploy block (never 0 in production — 0 forces a full-chain scan).
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/vouchcore.ts
      entities:
        - Provider
        - Job
        - Guarantee
        - Payout
      abis:
        - name: VouchCore
          file: ./abis/VouchCore.json
      eventHandlers:
        - event: JobCreated(indexed uint256,indexed address,indexed address,uint256,uint256)
          handler: handleJobCreated
        - event: GuaranteeLocked(indexed uint256,indexed address,uint256,uint256)
          handler: handleGuaranteeLocked
        - event: TaskFeeReleased(indexed uint256,indexed address,uint256)
          handler: handleTaskFeeReleased
        - event: CoverageOpened(indexed uint256,indexed address,uint64)
          handler: handleCoverageOpened
        - event: RegressionProven(indexed uint256,indexed address,indexed address,uint256)
          handler: handleRegressionProven
        - event: GuaranteePaid(indexed uint256,indexed address,uint256)
          handler: handleGuaranteePaid
        - event: GuaranteeReleased(indexed uint256,indexed address,uint256)
          handler: handleGuaranteeReleased
