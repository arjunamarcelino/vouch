# Vouch AssuranceHub subgraph. The Graph is AUTHORITATIVE for provider performance history.
#
# Entity id strategy: Provider = address; Job/Guarantee/Claim/Payout = jobId (Bytes-encoded uint256).
# jobId-as-id makes reprocessing an UPSERT, matching onchain idempotency. Only commitments (bytes32
# hashes) are stored — never preimages (plan §6.5).
#
# Counter ownership (plan §18.5): each Provider counter is owned by exactly ONE event so the
# same-tx pairs (JobCreated+JobFunded, InitialEvaluationResolved+CoverageStarted+ServiceFeePaid,
# ConfidentialEvaluationResolved+GuaranteePaid) never double-count.

enum JobStatus {
  FUNDED
  ACCEPTED
  SUBMITTED
  INITIALLY_APPROVED
  CLAIM_PENDING
  CLAIM_PAID
  COMPLETED
  CANCELLED
  EXPIRED
}

enum GuaranteeStatus {
  LOCKED
  PAID
  RELEASED
}

"""
Provider reputation aggregate (mutable). regressionRate = claimsPaid / jobsCompleted (computed by consumers).
"""
type Provider @entity(immutable: false) {
  id: Bytes!
  jobsCreated: BigInt!
  jobsFunded: BigInt!
  "Coverage windows that CLOSED (clean completion OR covered claim) — denominator for regressionRate."
  jobsCompleted: BigInt!
  guaranteesLocked: BigInt!
  guaranteesActive: BigInt!
  claimsOpened: BigInt!
  "Proven covered failures that paid a service credit (= regressions) — numerator for regressionRate."
  claimsPaid: BigInt!
  totalPaidOut: BigInt!
  totalGuaranteedValue: BigInt!
  totalFeesEarned: BigInt!
  totalServiceFees: BigInt!
  firstSeenBlock: BigInt!
  lastUpdatedBlock: BigInt!

  jobs: [Job!]! @derivedFrom(field: "provider")
  guarantees: [Guarantee!]! @derivedFrom(field: "provider")
  claims: [Claim!]! @derivedFrom(field: "provider")
  payouts: [Payout!]! @derivedFrom(field: "provider")
}

"""An assurance job (MUTABLE — status advances). id = jobId."""
type Job @entity(immutable: false) {
  id: Bytes!
  jobId: BigInt!
  client: Bytes!
  provider: Provider!
  status: JobStatus!
  taskFee: BigInt!
  guaranteeAmount: BigInt!
  serviceFee: BigInt!
  submissionDeadline: BigInt!
  coverageEnd: BigInt
  publicCriteriaHash: Bytes!
  privateCriteriaCommitment: Bytes!
  submissionCommitment: Bytes
  feeCounted: Boolean!
  serviceFeeCounted: Boolean!
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  txHash: Bytes!
}

"""A provider-funded performance guarantee (MUTABLE — LOCKED → PAID | RELEASED). id = jobId."""
type Guarantee @entity(immutable: false) {
  id: Bytes!
  job: Job!
  provider: Provider!
  amount: BigInt!
  status: GuaranteeStatus!
  coverageDeadline: BigInt
  lockedAtBlock: BigInt!
  lockedAtTimestamp: BigInt!
}

"""A client claim opened during coverage (MUTABLE — resolved by the CRE). id = jobId (one per job)."""
type Claim @entity(immutable: false) {
  id: Bytes!
  job: Job!
  provider: Provider!
  client: Bytes!
  evidenceCommitment: Bytes!
  "Confidential verdict. Meaningful only once resolvedAtTimestamp is set; false until then."
  covered: Boolean!
  serviceCredit: BigInt
  openedAtBlock: BigInt!
  openedAtTimestamp: BigInt!
  resolvedAtBlock: BigInt
  resolvedAtTimestamp: BigInt
}

"""A terminal service-credit payout to a client (IMMUTABLE). id = jobId (one payout per job)."""
type Payout @entity(immutable: true) {
  id: Bytes!
  job: Job!
  provider: Provider!
  amount: BigInt!
  toClient: Bytes!
  atBlock: BigInt!
  atTimestamp: BigInt!
  txHash: Bytes!
}
