# Vouch subgraph schema — The Graph is AUTHORITATIVE for provider performance history.
#
# Entity id strategy (plan §17.4 F4):
#   Provider.id  = provider address (Bytes)
#   Job.id       = jobId (Bytes-encoded uint256)   — immutable
#   Guarantee.id = jobId (Bytes-encoded uint256)   — mutable (LOCKED → PAID | RELEASED)
#   Payout.id    = jobId (Bytes-encoded uint256)   — immutable, one terminal payout per job (E5)
#
# Using jobId as the id for Guarantee & Payout makes handler reprocessing an UPSERT instead of
# appending duplicates, matching the onchain idempotency guarantees.

"""
Terminal lifecycle of a guarantee's collateral.
LOCKED   — provider has posted collateral; coverage window may be open.
PAID     — a covered regression was proven; collateral (capped) went to the client.
RELEASED — coverage window expired clean; collateral returned to the provider.
"""
enum GuaranteeStatus {
  LOCKED
  PAID
  RELEASED
}

"""
Provider reputation aggregate (mutable). Counters are derived in the subgraph (ADR-003) so the
contracts stay gas-cheap. regressionRate = regressions / jobsCompleted is computed by consumers.
"""
type Provider @entity(immutable: false) {
  "Provider address (Bytes)."
  id: Bytes!

  "Number of covered windows that closed (clean or regressed) — the denominator for regressionRate."
  jobsCompleted: BigInt!

  "Number of jobs ever created for this provider."
  jobsCreated: BigInt!

  "Number of guarantees this provider has ever locked."
  guaranteesLocked: BigInt!

  "Number of guarantees currently active (locked and not yet paid or released)."
  guaranteesActive: BigInt!

  "Number of proven covered regressions that resulted in a payout — the numerator for regressionRate."
  regressions: BigInt!

  "Total USDC (6-decimal base units) paid out to clients from this provider's guarantees."
  totalPaidOut: BigInt!

  "Total guaranteed value (sum of caps, 6-decimal base units) this provider has ever locked."
  totalGuaranteedValue: BigInt!

  "Total task fees (6-decimal base units) this provider has earned on completed work."
  totalFeesEarned: BigInt!

  "Block at which this provider was first indexed."
  firstSeenBlock: BigInt!

  "Block at which this provider aggregate was last mutated."
  lastUpdatedBlock: BigInt!

  jobs: [Job!]! @derivedFrom(field: "provider")
  guarantees: [Guarantee!]! @derivedFrom(field: "provider")
  payouts: [Payout!]! @derivedFrom(field: "provider")
}

"""
An assurance job (immutable). id = jobId.
"""
type Job @entity(immutable: true) {
  "jobId encoded as Bytes."
  id: Bytes!

  "The raw onchain uint256 jobId (kept for display / sorting)."
  jobId: BigInt!

  "Client address."
  client: Bytes!

  "Provider reputation aggregate."
  provider: Provider!

  "Task fee in USDC 6-decimal base units."
  taskFee: BigInt!

  "Advertised guarantee cap in USDC 6-decimal base units."
  guaranteeCap: BigInt!

  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  txHash: Bytes!
}

"""
A provider-funded performance guarantee (mutable — LOCKED → PAID | RELEASED). id = jobId.
"""
type Guarantee @entity(immutable: false) {
  "jobId encoded as Bytes (same id as the Job)."
  id: Bytes!

  "The job this guarantee covers."
  job: Job!

  "Provider reputation aggregate."
  provider: Provider!

  "Advertised guarantee cap in USDC 6-decimal base units."
  cap: BigInt!

  "Collateral actually locked in USDC 6-decimal base units (>= cap)."
  collateral: BigInt!

  "Current lifecycle status."
  status: GuaranteeStatus!

  "Coverage window deadline (unix seconds) once coverage is opened; null before then."
  coverageDeadline: BigInt

  "Whether the task fee has already been counted into provider.totalFeesEarned (idempotency guard)."
  taskFeeReleased: Boolean!

  lockedAtBlock: BigInt!
  lockedAtTimestamp: BigInt!
}

"""
A terminal service-credit payout to a client (immutable). id = jobId (one payout per job, E5).
"""
type Payout @entity(immutable: true) {
  "jobId encoded as Bytes (same id as the Job)."
  id: Bytes!

  "The job this payout settles."
  job: Job!

  "Provider reputation aggregate whose collateral funded the payout."
  provider: Provider!

  "Amount paid to the client in USDC 6-decimal base units (capped)."
  amount: BigInt!

  "Client address that received the payout."
  toClient: Bytes!

  atBlock: BigInt!
  atTimestamp: BigInt!
  txHash: Bytes!
}
