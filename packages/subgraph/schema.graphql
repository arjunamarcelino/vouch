# Vouch AssuranceHub subgraph — The Graph is AUTHORITATIVE for provider performance history.
#
# ID strategy (plan §3.1 / §3.5):
#   • Mutable lifecycle aggregates keyed by a NATURAL id (upsert semantics, matches on-chain
#     idempotency): Protocol = hub address; Provider/Client = address; Job/Coverage/Claim = jobId
#     (Bytes-encoded uint256); ProviderDailyMetric = provider ++ dayId.
#   • Immutable append-only event records keyed by txHash ++ logIndex (unique per log, so multiple
#     events in one transaction never collide): Submission, InitialEvaluation, ConfidentialEvaluation,
#     GuaranteePayout, CollateralMovement, ProviderRiskSnapshot.
#
# Risk math is integer BASIS POINTS computed in the mapping with BigInt (multiply-before-divide,
# isZero() guard → -1 sentinel). NEVER floating point. All timestamps are BigInt SECONDS (native
# Timestamp is avoided — Matchstick 0.6.0 crashes on it, issue #433; plan §3.5.5).
#
# AssemblyScript safety (docs/solutions/graph-cli-assemblyscript-compiler-crash-nullable-fields.md):
# no nullable value-type fields (Boolean/Int) — use `Boolean!` with a default set in the mapping and
# gate meaning on a reference-type field's presence (e.g. resolvedAtTimestamp). Only commitments
# (bytes32 hashes) are stored — never preimages (plan §6.5).

enum JobStatus {
  FUNDED
  ACCEPTED
  SUBMITTED
  INITIALLY_APPROVED
  CLAIM_PENDING
  CLAIM_PAID
  COMPLETED
  CANCELLED
  EXPIRED
}

enum CoverageStatus {
  LOCKED
  PAID
  RELEASED
}

"""How a CollateralMovement moved provider collateral (plan §3.5.7)."""
enum CollateralMovementKind {
  LOCK
  RELEASE_CLEAN
  RELEASE_REMAINDER
}

"""Protocol-level singleton anchor (id = AssuranceHub address). Thin — headline totals only."""
type Protocol @entity(immutable: false) {
  id: Bytes!
  totalProviders: BigInt!
  totalClients: BigInt!
  totalJobs: BigInt!
  totalGuaranteePaidOut: BigInt!
  lastUpdatedBlock: BigInt!
}

"""
Provider reputation aggregate (MUTABLE, id = address). Holds raw BigInt counters (the single source
of truth for "current" reputation) plus the last-materialized bps (internal diff source so
ProviderRiskSnapshot appends only on change — plan §3.5.2). Consumers read the bps from the latest
ProviderRiskSnapshot, not from here.
"""
type Provider @entity(immutable: false) {
  id: Bytes!

  # ---- raw counters (the 12 tracked metrics) ----
  jobsAccepted: BigInt!
  jobsInitiallyApproved: BigInt!
  "CLEAN coverage windows closed (no claim, or all claims resolved not-covered by a REAL verdict)."
  jobsCompleted: BigInt!
  "Windows closed after a claim resolved not-covered/timeout (contested). Kept separate so stonewalling the CRE can't read as a clean finish (finding 007). Full closed denominator = jobsCompleted + contestedCompletions + claimsUpheld."
  contestedCompletions: BigInt!
  claimsOpened: BigInt!
  "Proven covered failures that paid a service credit (= regressions)."
  claimsUpheld: BigInt!
  "Claims resolved not-covered by a REAL verdict (excludes CRE-inactivity timeouts, finding 007)."
  claimsRejected: BigInt!
  "USDC currently exposed as locked collateral (sum of LOCKED coverage amounts)."
  activeGuaranteeAmount: BigInt!
  "Sum of taskFee over initially-approved jobs (covered value denominator)."
  totalCoveredAmount: BigInt!
  "Sum of guaranteeAmount over accepted coverage (coverage-ratio numerator)."
  totalGuaranteedValue: BigInt!
  totalPayoutAmount: BigInt!
  totalFeesEarned: BigInt!
  totalServiceFees: BigInt!
  lastActivityTimestamp: BigInt!
  firstSeenBlock: BigInt!
  lastUpdatedBlock: BigInt!

  # ---- internal diff source for on-change snapshotting (plan §3.5.2) ----
  lastUpheldClaimRateBps: BigInt!
  lastClaimFrequencyBps: BigInt!
  lastAverageCoverageRatioBps: BigInt!
  lastPayoutToCoveredValueBps: BigInt!

  jobs: [Job!]! @derivedFrom(field: "provider")
  claims: [Claim!]! @derivedFrom(field: "provider")
  snapshots: [ProviderRiskSnapshot!]! @derivedFrom(field: "provider")
  dailyMetrics: [ProviderDailyMetric!]! @derivedFrom(field: "provider")
}

"""A client that commissions jobs (MUTABLE, id = address)."""
type Client @entity(immutable: false) {
  id: Bytes!
  jobsCommissioned: BigInt!
  claimsOpened: BigInt!
  totalTaskFeesPaid: BigInt!
  lastActivityTimestamp: BigInt!
  firstSeenBlock: BigInt!
  jobs: [Job!]! @derivedFrom(field: "client")
}

"""An assurance job (MUTABLE — status advances). id = jobId."""
type Job @entity(immutable: false) {
  id: Bytes!
  jobId: BigInt!
  client: Client!
  provider: Provider!
  status: JobStatus!
  taskFee: BigInt!
  guaranteeAmount: BigInt!
  serviceFee: BigInt!
  submissionDeadline: BigInt!
  coverageEnd: BigInt
  publicCriteriaHash: Bytes!
  privateCriteriaCommitment: Bytes!
  submissionCommitment: Bytes
  "Idempotency latch: taskFee counted into provider.totalFeesEarned exactly once."
  feeCounted: Boolean!
  "Idempotency latch: serviceFee counted exactly once."
  serviceFeeCounted: Boolean!
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  txHash: Bytes!

  coverage: Coverage @derivedFrom(field: "job")
  claim: Claim @derivedFrom(field: "job")
  submissions: [Submission!]! @derivedFrom(field: "job")
  initialEvaluations: [InitialEvaluation!]! @derivedFrom(field: "job")
  confidentialEvaluations: [ConfidentialEvaluation!]! @derivedFrom(field: "job")
  payouts: [GuaranteePayout!]! @derivedFrom(field: "job")
  collateralMovements: [CollateralMovement!]! @derivedFrom(field: "job")
}

"""A provider-funded coverage window / performance guarantee (MUTABLE — LOCKED → PAID | RELEASED). id = jobId."""
type Coverage @entity(immutable: false) {
  id: Bytes!
  job: Job!
  provider: Provider!
  amount: BigInt!
  status: CoverageStatus!
  coverageDeadline: BigInt
  lockedAtBlock: BigInt!
  lockedAtTimestamp: BigInt!
}

"""A client claim opened during coverage (MUTABLE — resolved by the CRE). id = jobId (one per job)."""
type Claim @entity(immutable: false) {
  id: Bytes!
  job: Job!
  provider: Provider!
  client: Client!
  evidenceCommitment: Bytes!
  "Confidential verdict. Meaningful only once resolvedAtTimestamp is set; false until then."
  covered: Boolean!
  "True if closed by resolveClaimTimeout (CRE inactivity) rather than a real verdict (finding 007)."
  resolvedByTimeout: Boolean!
  serviceCredit: BigInt
  openedAtBlock: BigInt!
  openedAtTimestamp: BigInt!
  resolvedAtBlock: BigInt
  resolvedAtTimestamp: BigInt
}

# ------------------------------------------------------------------ #
#          Immutable append-only event records (txHash ++ logIndex)  #
# ------------------------------------------------------------------ #

"""A provider deliverable submission (IMMUTABLE). id = txHash ++ logIndex."""
type Submission @entity(immutable: true) {
  id: Bytes!
  job: Job!
  provider: Provider!
  submissionCommitment: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""A public initial-evaluation verdict (IMMUTABLE). id = txHash ++ logIndex."""
type InitialEvaluation @entity(immutable: true) {
  id: Bytes!
  job: Job!
  provider: Provider!
  evaluator: Bytes!
  approved: Boolean!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""A confidential (CRE) claim verdict (IMMUTABLE). id = txHash ++ logIndex. resolvedByTimeout is stamped at construction from the mutable Claim (finding 007)."""
type ConfidentialEvaluation @entity(immutable: true) {
  id: Bytes!
  job: Job!
  provider: Provider!
  covered: Boolean!
  serviceCredit: BigInt!
  resolvedByTimeout: Boolean!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""A terminal service-credit payout to a client (IMMUTABLE). id = txHash ++ logIndex."""
type GuaranteePayout @entity(immutable: true) {
  id: Bytes!
  job: Job!
  provider: Provider!
  amount: BigInt!
  toClient: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""A movement of provider collateral (IMMUTABLE). id = txHash ++ logIndex."""
type CollateralMovement @entity(immutable: true) {
  id: Bytes!
  job: Job!
  provider: Provider!
  kind: CollateralMovementKind!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

# ------------------------------------------------------------------ #
#                    Risk snapshot + daily metrics                   #
# ------------------------------------------------------------------ #

"""
Point-in-time computed risk features (IMMUTABLE history series). id = provider ++ txHash ++ logIndex
(constant-length operands; collision-free on same-tx bursts — plan §3.5.2). Appended only when a bps
value changes. Consumers read the latest via orderBy: blockNumber desc, first: 1.
All ratios are integer bps; -1 means undefined (denominator was zero) — never read -1 as a real ratio.
"""
type ProviderRiskSnapshot @entity(immutable: true) {
  id: Bytes!
  provider: Provider!
  completedJobs: BigInt!
  upheldClaimRateBps: BigInt!
  claimFrequencyBps: BigInt!
  averageCoverageRatioBps: BigInt!
  payoutToCoveredValueBps: BigInt!
  totalCoveredAmount: BigInt!
  totalPayoutAmount: BigInt!
  "Number of resolved claims (real verdicts) — sample size for rate confidence."
  sampleSize: BigInt!
  "False when the provider has too little history for the rates to be meaningful."
  hasEnoughHistory: Boolean!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
Per-provider, per-day rollup (MANUAL day-bucket — plan §3.5.5; native @aggregation avoided for
Matchstick #433). id = provider ++ dayId, dayId = timestamp / 86400 (seconds). Updated only on claim
resolutions so the agent can compute a trailing-window recentFailureRate = sum(upheldFailures) /
sum(resolvedClaims) over the last N days (both a numerator AND a denominator series are required).
"""
type ProviderDailyMetric @entity(immutable: false) {
  id: Bytes!
  provider: Provider!
  "Days since Unix epoch (block.timestamp / 86400)."
  dayId: BigInt!
  "Bucket start timestamp (dayId * 86400), seconds."
  dayStartTimestamp: BigInt!
  "Claims upheld (covered) that day — the recent-failure numerator."
  upheldFailures: BigInt!
  "Claims resolved by a real verdict that day (excludes timeouts) — the denominator."
  resolvedClaims: BigInt!
  "Service credit paid out that day."
  payoutAmount: BigInt!
  lastUpdatedBlock: BigInt!
}
