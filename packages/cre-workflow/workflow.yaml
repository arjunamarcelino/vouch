# Chainlink CRE — workflow manifest (aligned to the current CLI schema).

staging-settings:
  user-workflow:
    workflow-name: vouch-outcome-assurance

  workflow-artifacts:
    # Entry point compiled to WASM and run by the CRE runtime.
    workflow-path: ./workflow.ts
    # Non-secret runtime config validated by configSchema in config.ts.
    config-path: ./config.staging.json
    # Secret NAME -> env var mapping (values live in the Vault DON, never here).
    # Copy secrets.yaml.example -> secrets.yaml (git-ignored) before provisioning.
    secrets-path: ./secrets.yaml
