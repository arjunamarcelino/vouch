# Chainlink CRE — project settings (non-secret).
# Secrets are provisioned separately via `cre secrets create secrets.yaml` and
# released by the Vault DON at runtime.

staging-settings:
  # RPCs the CRE build/simulate uses. Arc testnet is the settlement chain.
  rpcs:
    - chain-name: arc-testnet
      url: ${ARC_TESTNET_RPC_URL} # placeholder — set in your shell / .env for sim

  # The workflow owner (deployer) address. Placeholder — set before deploy.
  workflow-owner-address: "0x0000000000000000000000000000000000000000"
