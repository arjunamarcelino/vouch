[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# Arc is a standard EVM L1; "paris" avoids PUSH0/transient-storage assumptions that
# may not be enabled on the target chain. Confirm before enabling "cancun"/"shanghai".
evm_version = "paris"
# Emit the ABI as a separate artifact so `script/sync-abis.mjs` can read it and
# regenerate packages/shared/src/abis/vouchCore.ts (ABI single source of truth).
extra_output_files = ["abi"]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 32
fail_on_revert = false

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
