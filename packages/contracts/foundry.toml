[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# Arc is a standard EVM L1; "paris" avoids PUSH0/transient-storage assumptions that
# may not be enabled on the target chain. Confirm before enabling "cancun"/"shanghai".
evm_version = "paris"
# Emit the ABI as a separate artifact so `script/sync-abis.mjs` can read it and
# regenerate packages/shared/src/abis/vouchCore.ts (ABI single source of truth).
extra_output_files = ["abi"]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256
max_test_rejects = 1_000_000

[invariant]
runs = 256
depth = 128
# Handler actions are state-guarded no-ops, so any revert is a real bug (plan §18.4/§12.5).
fail_on_revert = true
shrink_run_limit = 5000

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"

# Arcscan is Blockscout — `forge verify-contract --verifier blockscout` (key ignored).
[etherscan]
arc_testnet = { key = "${ARCSCAN_API_KEY}", chain = 5042002, url = "https://testnet.arcscan.app/api/" }
